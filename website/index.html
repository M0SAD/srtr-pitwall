<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SRTR Pitwall — iRacing overlay, spotter ve strateji</title>
    <meta
      name="description"
      content="SRTR Pitwall: iRacing için hepsi bir arada yardımcı. 50+ overlay, canlı sohbet, sesli mühendis ve spotter, yakıt stratejisi, arkadaşlarla canlı veri, OBS yayın düzenleri ve topluluk."
    />
    <meta property="og:title" content="SRTR Pitwall" />
    <meta property="og:description" content="iRacing overlay, spotter, strategy, streaming and community in one lightweight app." />
    <link rel="icon" href="assets/img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/friends.css" />
    <link rel="stylesheet" href="assets/features.css" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SRTR Pitwall" />
    <meta property="og:url" content="https://pitwall.simracetr.com/" />
    <meta property="og:image" content="https://pitwall.simracetr.com/assets/img/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pitwall.simracetr.com/assets/img/og.jpg" />
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="wrap hero-grid">
          <div>
            <span class="eyebrow" data-t="hero_eyebrow"></span>
            <h1 data-t="hero_title"></h1>
            <p class="lead" data-t="hero_lead"></p>
            <div class="hero-cta">
              <a href="#" class="btn btn-accent btn-lg" data-download><span data-t="hero_download"></span></a>
              <a href="#pricing" class="btn btn-lg" data-t="hero_pro"></a>
            </div>
            <p class="muted small"><span data-t="hero_meta"></span> <span data-version></span></p>
            <div class="pills">
              <span class="pill" data-t="pill_overlays"></span>
              <span class="pill" data-t="pill_spotter"></span>
              <span class="pill" data-t="pill_sims"></span>
              <span class="pill" data-t="pill_langs"></span>
              <span class="pill" data-t="pill_free"></span>
            </div>
          </div>
          <div class="hero-shot"><img data-slot="home.hero" src="assets/img/layout.jpg" alt="SRTR Pitwall overlays" width="1100" height="566" /></div>
        </div>
      </section>

      <section id="features" class="band">
        <div class="wrap">
          <div class="sec-head">
            <span class="eyebrow" data-t="feat_eyebrow"></span>
            <h2 data-t="feat_title"></h2>
            <p class="muted" data-t="feat_lead"></p>
          </div>
          <div class="grid g3" id="feat-grid"></div>
          <div class="feat-more"><a href="features.html" class="btn btn-accent btn-lg" data-t="feat_more"></a></div>
        </div>
      </section>

      <section id="overlay-gallery">
        <div class="wrap">
          <div class="sec-head">
            <span class="eyebrow" data-t="ovg_eyebrow"></span>
            <h2 data-t="ovg_title" data-ovg-count></h2>
            <p class="muted" data-t="ovg_lead"></p>
          </div>
          <div class="ovg" id="ovg"></div>
          <p class="muted small ovg-hint" data-t="ovg_hint"></p>
        </div>
      </section>

      <section id="gallery" data-gallery-host hidden>
        <div class="wrap">
          <div class="sec-head">
            <span class="eyebrow" data-t="gal_eyebrow"></span>
            <h2 data-t="gal_title"></h2>
          </div>
          <div class="gallery-strip" data-slot="home.gallery" data-gallery></div>
        </div>
      </section>

      <div class="wrap ad-home" data-ad="site_home" hidden></div>

      <section>
        <div class="wrap split">
          <div>
            <span class="eyebrow" data-t="panel_eyebrow"></span>
            <h2 data-t="panel_title"></h2>
            <p class="muted" data-t="panel_lead"></p>
            <ul class="checks">
              <li data-t="panel_c1"></li>
              <li data-t="panel_c2"></li>
              <li data-t="panel_c3"></li>
              <li data-t="panel_c4"></li>
            </ul>
          </div>
          <img data-slot="home.panel" src="assets/img/panel.jpg" alt="" loading="lazy" width="1400" height="803" />
        </div>
      </section>

      <section class="band">
        <div class="wrap split rev">
          <div>
            <span class="eyebrow" data-t="friends_eyebrow"></span>
            <h2 data-t="friends_title"></h2>
            <p class="muted" data-t="friends_lead"></p>
            <ul class="checks">
              <li data-t="friends_c1"></li>
              <li data-t="friends_c2"></li>
              <li data-t="friends_c3"></li>
              <li data-t="friends_c4"></li>
              <li data-t="friends_c5"></li>
              <li data-t="friends_c6"></li>
            </ul>
          </div>
          <img class="narrow" data-slot="home.friends" src="assets/img/friend.jpg" alt="" loading="lazy" width="360" height="836" />
        </div>
      </section>

      <section>
        <div class="wrap">
          <div class="sec-head">
            <span class="eyebrow" data-t="perf_eyebrow"></span>
            <h2 data-t="perf_title"></h2>
          </div>
          <div class="grid g4">
            <div class="card feat"><div class="ic">⚙️</div><h3 data-t="perf1_t"></h3><p data-t="perf1_d"></p></div>
            <div class="card feat"><div class="ic">🎯</div><h3 data-t="perf2_t"></h3><p data-t="perf2_d"></p></div>
            <div class="card feat"><div class="ic">💤</div><h3 data-t="perf3_t"></h3><p data-t="perf3_d"></p></div>
            <div class="card feat"><div class="ic">🔄</div><h3 data-t="perf4_t"></h3><p data-t="perf4_d"></p></div>
          </div>
        </div>
      </section>

      <section id="compare" class="band">
        <div class="wrap">
          <div class="sec-head">
            <span class="eyebrow" data-t="cmp_eyebrow"></span>
            <h2 data-t="cmp_title"></h2>
            <p class="muted" data-t="cmp_lead"></p>
          </div>
          <div class="card table-scroll">
            <table class="compare">
              <thead>
                <tr>
                  <th></th>
                  <th data-t="cmp_free"></th>
                  <th data-t="cmp_account"></th>
                  <th class="pro">PRO</th>
                </tr>
              </thead>
              <tbody id="cmp-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="pricing">
        <div class="wrap">
          <div class="sec-head">
            <span class="eyebrow" data-t="price_eyebrow"></span>
            <h2 data-t="price_title"></h2>
            <p class="muted" data-t="price_lead"></p>
          </div>
          <div class="plans" id="plans"></div>
          <div class="card alt-pay">
            <div>
              <h3 data-t="patreon_title"></h3>
              <p class="muted small" style="margin: 0" data-t="patreon_lead"></p>
            </div>
            <div class="row" id="alt-pay-btns"></div>
          </div>
          <p class="muted small" id="pro-note" style="margin-top: 14px"></p>
        </div>
      </section>

      <section id="faq" class="band">
        <div class="wrap" style="max-width: 820px">
          <div class="sec-head">
            <span class="eyebrow" data-t="faq_eyebrow"></span>
            <h2 data-t="faq_title"></h2>
          </div>
          <div class="faq" id="faq-list"></div>
        </div>
      </section>

      <section class="cta-band">
        <div class="wrap">
          <h2 data-t="cta_title"></h2>
          <p class="muted" data-t="cta_lead"></p>
          <div class="row" style="justify-content: center">
            <a href="#" class="btn btn-accent btn-lg" data-download data-t="hero_download"></a>
            <a href="hesap.html?mode=signup" class="btn btn-lg" data-t="cta_signup"></a>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="assets/home.js"></script>
    <script type="module" src="assets/friends.js"></script>
  </body>
</html>
