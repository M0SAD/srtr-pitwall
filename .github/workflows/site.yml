# Web sitesini (website/ klasörü) GitHub Pages'e yayınlar.
# main dalına yapılan HER push'ta çalışır (website/ değişmemiş olsa da): arada push'lanmayan bir sürümün site
# değişiklikleri sonraki push'ta kaçmasın. İş ~20 sn sürer; aynı içerik yeniden yayınlanırsa hiçbir şey bozulmaz.
# İlk kurulum: GitHub → Settings → Pages → Source: "GitHub Actions".
name: 071026-249

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Yanlışlıkla website/ içine kopyalanmış proje dosyaları siteye karışmasın
      - run: node scripts/temizle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
