# Sürüm yayınlama: main dalına gönderim (push) yapılınca version.json'daki sürüm için henüz
# "v1.0.X" yayını yoksa Windows derlemesi yapılır, imzalanır, etiket otomatik oluşturulur,
# GitHub Releases'a yüklenir ve latest.json (güncelleme bilgisi) hazırlanır.
# Sürüm zaten yayınlanmışsa hiçbir şey yapmaz, yani elle etiket atmana gerek yok.
# Kurulum ve anahtarlar: docs/GUNCELLEME.md

name: Sürüm yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm daha önce yayınlanmış mı
        id: v
        run: |
          TAG="v$(node -p "require('./version.json').semver")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$TAG zaten yayınlanmış, atlanıyor."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Sürüm bilgisi ve notlar
        id: meta
        shell: bash
        run: |
          echo "display=$(node -p "require('./version.json').display")" >> "$GITHUB_OUTPUT"
          node scripts/notlar.mjs | tr -d '\r' > "$RUNNER_TEMP/notes.txt"
          DELIM="NOTES_$(date +%s%N)"
          {
            echo "notes<<$DELIM"
            cat "$RUNNER_TEMP/notes.txt"
            echo
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ needs.check.outputs.tag }}
          releaseName: "SRTR Pitwall ${{ steps.meta.outputs.display }}"
          releaseBody: ${{ steps.meta.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json
