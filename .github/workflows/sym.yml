name: crash-symbolize
on:
  push:
    branches: [crash-symbolize]
permissions:
  contents: write
  actions: read
jobs:
  sym:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pdb-v1.0.426, run-id: "40144243079", github-token: "${{ secrets.GITHUB_TOKEN }}", path: p426 }
      - name: tools
        run: |
          T=$(ls /usr/bin/llvm-pdbutil* /usr/lib/llvm-*/bin/llvm-pdbutil 2>/dev/null | head -1)
          if [ -z "$T" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq llvm >/dev/null; T=$(ls /usr/bin/llvm-pdbutil* /usr/lib/llvm-*/bin/llvm-pdbutil 2>/dev/null | head -1); fi
          echo "T=$T" >> $GITHUB_ENV
      - name: symbolize
        run: |
          P=$(ls p426/*.pdb | grep -i pitwall | head -1)
          python3 sym.py "$P" v426 0x93E38F,0x14EC52F,0x14EC4B2,0x3ACD,0x1587E,0x3971,0x8984D5,0x897F14,0x1307E7F "$T"
      - name: save
        run: |
          git config user.name "crash-symbolize"
          git config user.email "actions@users.noreply.github.com"
          git add out-*.txt
          git commit -m "symbolize output"
          git push origin HEAD:crash-symbolize
