[package]
name = "pitwall"
version = "1.0.141"
description = "Hafif ve hızlı iRacing overlay uygulaması"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pitwall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tiny_http = "0.12"
base64 = "0.22"
rumqttc = { version = "0.25", default-features = false }
rumqttd = { version = "0.20", default-features = false }
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
tauri-plugin-notification = "2"
vorbis_rs = "0.5.4"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
hound = "3.5"
# Canlı sohbet (Twitch IRC / Kick Pusher / Streamlabs websocket bağlantıları, bkz. src/livechat)
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Cryptography",
  # Sesli komut (bas-konuş): direksiyon / kumanda düğmesi (Raw Input HID + WinMM joystick), bkz. src/ptt_win.rs
  "Win32_UI_Input",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Media_Multimedia",
  "Win32_Storage_FileSystem",
] }
# Canlı sohbet: Windows sesleriyle sesli okuma (SpeechSynthesis) ve konuşmayı yazıya çevirme (SpeechRecognition)
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Media",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Media_SpeechRecognition",
  # Sesli komut: mikrofon listesi ve varsayılan kayıt cihazı
  "Media_Devices",
  "Devices_Enumeration",
  "Storage",
  "Storage_Streams",
  # Sesli okuma: klasik SAPI5 sesleri (ISpVoice → bellek akışı), bkz. src/livechat/tts_win.rs
  "Win32_Media_Speech",
  "Win32_Media_Audio",
  # Edge çevrimiçi sesleri: MP3 → PCM (Media Foundation Source Reader), bkz. src/livechat/mp3_win.rs
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Globalization",
] }
# Sesli komut: komut listesi kısıtı için IIterable<HSTRING> (windows crate'inin zaten kullandığı sürüm)
windows-collections = "0.3"

# En hızlı ve en küçük exe için sürüm profili.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# "unwind": bir iş parçacığındaki panic tüm programı kapatmasın (catch_unwind + crash.log, bkz. src/crashlog.rs).
panic = "unwind"
strip = true
incremental = false

# Geliştirmede bağımlılıklar optimize derlensin (demo/telemetri akıcı çalışsın).
[profile.dev.package."*"]
opt-level = 2
