[package]
name = "pitwall"
version = "1.0.16"
description = "Hafif ve hızlı iRacing overlay uygulaması"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pitwall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tiny_http = "0.12"
base64 = "0.22"
rumqttc = { version = "0.25", default-features = false }
rumqttd = { version = "0.20", default-features = false }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
] }

# En hızlı ve en küçük exe için sürüm profili.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Geliştirmede bağımlılıklar optimize derlensin (demo/telemetri akıcı çalışsın).
[profile.dev.package."*"]
opt-level = 2
